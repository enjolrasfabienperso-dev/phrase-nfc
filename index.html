function easter(year) {
  const a = year % 19;
  const b = Math.floor(year / 100);
  const c = year % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(Date.UTC(year, month - 1, day));
}
function addDays(date, n) {
  const d = new Date(date);
  d.setUTCDate(d.getUTCDate() + n);
  return d;
}
function keyOf(date) {
  const m = String(date.getUTCMonth() + 1).padStart(2, "0");
  const d = String(date.getUTCDate()).padStart(2, "0");
  return m + "-" + d;
}

function eventKey(year, month, day) {
  const fixed = {
    "01-01": "newyear",
    "01-06": "kings",
    "02-02": "candle",
    "04-01": "fish",
    "05-01": "labour",
    "05-08": "victory",
    "06-21": "music",
    "07-14": "bastille",
    "08-15": "august",
    "11-01": "saints",
    "11-11": "armistice",
    "12-24": "xmasEve",
    "12-25": "xmas",
    "12-31": "sylvestre"
  };
  const id = String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0");
  if (fixed[id]) return fixed[id];
  const eas = easter(year);
  const today = keyOf(new Date(Date.UTC(year, month - 1, day)));
  if (keyOf(eas) === today) return "easter";
  if (keyOf(addDays(eas, 1)) === today) return "eastermon";
  if (keyOf(addDays(eas, -47)) === today) return "carnival";
  if (keyOf(addDays(eas, 39)) === today) return "ascent";
  if (keyOf(addDays(eas, 49)) === today) return "whit";
  if (keyOf(addDays(eas, 50)) === today) return "whit";
  return null;
}

function parisNow() {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/Paris",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    hourCycle: "h23"
  }).formatToParts(new Date());
  const get = (t) => Number(parts.find((p) => p.type === t).value);
  return { year: get("year"), month: get("month"), day: get("day"), hour: get("hour") };
}

function pick(seed, list) {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return list[(h >>> 0) % list.length];
}

const now = parisNow();
const slot = Math.floor(now.hour / 3);
const seed = String(now.year) + String(now.month).padStart(2, "0") + String(now.day).padStart(2, "0") + "-" + slot;
const ev = eventKey(now.year, now.month, now.day);
const list = ev ? EVENTS[ev] : GENERAL;
const item = pick(seed, list);
const tone = TONES[item.tone];
